[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petradb"
version = "1.5.0"
description = "Embeddable SQL database for Python — PostgreSQL-compatible, in-memory or persistent"
readme = "README.md"
license = "ISC"
requires-python = ">=3.8"
authors = [{name = "Edward A. Maxedon, Sr.", email = "edadma@gmail.com"}]
keywords = ["sql", "database", "embedded", "postgresql", "in-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://petradb.dev"
Repository = "https://github.com/edadma/petradb"

[tool.setuptools.packages.find]
where = ["."]
include = ["petradb*"]

[tool.setuptools.package-data]
petradb = ["*.so", "*.dylib"]
